<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="_base.css"/>
<style>
  /* Centered composition: survives Substack's center-crop (feed crops the sides of
     wide images). All content stacked + centered with generous safe margins, so any
     crop from 1:1 to 2:1 keeps the headline intact. */
  html,body{ width:1200px; height:800px; }
  body{
    width:1200px; height:800px; overflow:hidden; position:relative;
    background:
      radial-gradient(70% 60% at 50% 10%, rgba(58,72,92,.28) 0%, transparent 60%),
      radial-gradient(80% 70% at 50% 100%, rgba(204,122,59,.14) 0%, transparent 55%),
      var(--ink);
    color:var(--bone); font-family:"Switzer",sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:90px 120px;
  }
  .mark{ margin-bottom:40px; }
  .mark svg{ width:170px; height:170px; overflow:visible; }
  .core{ filter:drop-shadow(0 0 14px rgba(204,122,59,.65)); }
  .eyebrow{ font-weight:500; font-size:22px; letter-spacing:.22em; text-transform:uppercase; color:var(--copper-lo); margin-bottom:26px; }
  h1{ font-family:"Clash Display",serif; font-weight:600; font-size:86px; line-height:1.02; letter-spacing:-.01em; margin-bottom:30px; }
  h1 .cop{ color:var(--copper); }
  p.sub{ font-size:27px; line-height:1.42; color:var(--bone-dim); max-width:760px; font-weight:400; margin-bottom:46px; }
  .foot{ display:flex; align-items:center; gap:14px;
         font-family:"Clash Display",serif; font-weight:600; font-size:25px; color:var(--bone); }
  .foot .dot{ width:9px; height:9px; border-radius:50%; background:var(--copper); }
</style></head>
<body>
  <div class="mark"><svg viewBox="0 0 400 400">
    <g transform="rotate(0 200 200)"><ellipse class="ring" cx="200" cy="200" rx="150" ry="56"/><circle class="body" cx="350" cy="200" r="13"/></g>
    <g transform="rotate(60 200 200)"><ellipse class="ring" cx="200" cy="200" rx="150" ry="56"/><circle class="body" cx="350" cy="200" r="13"/></g>
    <g transform="rotate(120 200 200)"><ellipse class="ring" cx="200" cy="200" rx="150" ry="56"/><circle class="body" cx="350" cy="200" r="13"/></g>
    <circle class="core" cx="200" cy="200" r="19"/></svg></div>
  <div class="eyebrow">The Three-Body Program</div>
  <h1>One program.<br><span class="cop">Not three.</span></h1>
  <p class="sub">Modernization, team redesign, and GenAI adoption, moving together. Hands-on, with a number on the outcome.</p>
  <div class="foot"><span class="dot"></span>tilinthecloud.com</div>
</body></html>

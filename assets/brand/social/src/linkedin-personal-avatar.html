<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="_base.css"/>
<style>
  html,body{ width:800px; height:800px; }
  /* ink corners (not transparent): safe if ever shown square; LinkedIn circle-crops them away anyway */
  body{ width:800px; height:800px; overflow:hidden; position:relative; background:var(--ink); }
  .ph{ position:absolute; inset:0; border-radius:50%;
       background-image:url("headshot.jpg"); background-size:cover; background-position:center 42%; }
  /* copper ring, inset so the circle crop never clips it */
  .ring-frame{ position:absolute; inset:10px; border-radius:50%;
       border:12px solid var(--copper);
       box-shadow:0 0 0 3px rgba(15,19,24,.9), 0 0 34px rgba(204,122,59,.45),
                  inset 0 0 60px rgba(15,19,24,.55); }
  /* three-body mark badge, bottom-right, kept inside the inscribed circle */
  .badge{ position:absolute; left:560px; top:648px; transform:translate(-50%,-50%);
          width:150px; height:150px; border-radius:50%;
          background:radial-gradient(70% 70% at 50% 45%, #161B23 0%, #0F1318 100%);
          border:4px solid var(--copper);
          box-shadow:0 6px 18px rgba(0,0,0,.5), 0 0 22px rgba(204,122,59,.45);
          display:flex; align-items:center; justify-content:center; }
  .badge svg{ width:108px; height:108px; overflow:visible; }
  .badge .ring{ stroke:#8E99AD; stroke-width:5; }
  .badge .body{ stroke-width:3; filter:drop-shadow(0 0 6px rgba(204,122,59,.65)); }
  .badge .core{ filter:drop-shadow(0 0 10px rgba(204,122,59,.85)); }
</style></head>
<body>
  <div class="ph"></div>
  <div class="ring-frame"></div>
  <div class="badge"><svg viewBox="0 0 400 400">
    <g transform="rotate(0 200 200)"><ellipse class="ring" cx="200" cy="200" rx="158" ry="60"/><circle class="body" cx="358" cy="200" r="21"/></g>
    <g transform="rotate(60 200 200)"><ellipse class="ring" cx="200" cy="200" rx="158" ry="60"/><circle class="body" cx="358" cy="200" r="21"/></g>
    <g transform="rotate(120 200 200)"><ellipse class="ring" cx="200" cy="200" rx="158" ry="60"/><circle class="body" cx="358" cy="200" r="21"/></g>
    <circle class="core" cx="200" cy="200" r="30"/></svg></div>
</body></html>

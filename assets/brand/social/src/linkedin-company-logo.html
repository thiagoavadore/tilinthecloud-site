<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="_base.css"/>
<style>
  html,body{ width:600px; height:600px; }
  body{
    width:600px; height:600px; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(78% 78% at 50% 44%, rgba(58,72,92,.34) 0%, transparent 62%),
      radial-gradient(66% 66% at 50% 50%, rgba(204,122,59,.16) 0%, transparent 58%),
      var(--ink);
  }
  /* mark fills ~86% of the tile (was ~63%) */
  svg{ width:516px; height:516px; overflow:visible; }
  /* brighter, thicker rings so the orbits survive at small avatar sizes */
  .ring{ stroke:#8E99AD; stroke-width:5; }
  .body{ stroke-width:3; filter:drop-shadow(0 0 10px rgba(204,122,59,.55)); }
  .core{ filter:drop-shadow(0 0 18px rgba(204,122,59,.75)); }
</style></head>
<body>
  <svg viewBox="0 0 400 400">
    <g transform="rotate(0 200 200)"><ellipse class="ring" cx="200" cy="200" rx="166" ry="62"/><circle class="body" cx="366" cy="200" r="23"/></g>
    <g transform="rotate(60 200 200)"><ellipse class="ring" cx="200" cy="200" rx="166" ry="62"/><circle class="body" cx="366" cy="200" r="23"/></g>
    <g transform="rotate(120 200 200)"><ellipse class="ring" cx="200" cy="200" rx="166" ry="62"/><circle class="body" cx="366" cy="200" r="23"/></g>
    <circle class="core" cx="200" cy="200" r="32"/>
  </svg>
</body></html>
